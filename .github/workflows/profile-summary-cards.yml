name: GitHub Profile Summary Cards

on:
  schedule:
    # 18:00 UTC daily = 04:00 Melbourne (AEST) / 05:00 (AEDT)
    - cron: "0 18 * * *"
  workflow_dispatch:

# Only the two themes the READMEs actually reference are generated. Letting the
# action emit all 65 themes rewrites 325 files (1.8 MB) on every scheduled run,
# which would add roughly 650 MB of git history a year for cards nobody loads.
env:
  LIGHT_THEME: github
  DARK_THEME: github_dark

jobs:
  generate:
    runs-on: ubuntu-latest
    name: generate-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Generate light cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Uses a personal access token if you add one as the SUMMARY_GITHUB_TOKEN
          # repo secret; otherwise falls back to the built-in token, which the
          # `permissions: contents: write` block above grants push access.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          # Melbourne is UTC+10 (AEST); the productive-time card reads local hours.
          UTC_OFFSET: 10
          THEME: github
          AUTO_PUSH: false

      - name: Generate dark cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 10
          THEME: github_dark
          AUTO_PUSH: false

      - name: Commit cards
        run: |
          set -euo pipefail
          cd profile-summary-card-output
          # Drop any theme directory left over from an earlier all-themes run.
          find . -mindepth 1 -maxdepth 1 -type d \
            ! -name "$LIGHT_THEME" ! -name "$DARK_THEME" -exec rm -rf {} +
          cd ..

          # Fail loudly rather than committing a README full of broken images.
          for theme in "$LIGHT_THEME" "$DARK_THEME"; do
            for card in 0-profile-details 1-repos-per-language \
                        2-most-commit-language 3-stats 4-productive-time; do
              path="profile-summary-card-output/$theme/$card.svg"
              test -s "$path" || { echo "::error::missing or empty $path"; exit 1; }
            done
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-summary-card-output
          git diff --cached --quiet && { echo "Cards unchanged."; exit 0; }
          git commit -m "Update profile summary cards"
          git push
